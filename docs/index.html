<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>たろうとくろーどちゃんのさくひんひろば</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic Pro', Meiryo, sans-serif;
      background: linear-gradient(135deg, #fff8e7 0%, #ffe4f0 50%, #e4f0ff 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 2.2rem;
      color: #d43f7a;
      text-shadow: 2px 2px 0 #ffb3d1;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 1rem;
      color: #999;
      margin-bottom: 40px;
    }
    .list {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .item {
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.09);
      padding: 18px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: transform 0.15s, box-shadow 0.15s;
      border-left: 6px solid #64b5f6;
    }
    .item:hover {
      transform: translateX(4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
    }
    .item-emoji { font-size: 2rem; flex-shrink: 0; }
    .item-body { flex: 1; }
    .item-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 3px;
    }
    .item-desc { font-size: 0.88rem; color: #888; }
    .item-date {
      font-size: 0.8rem;
      color: #bbb;
      flex-shrink: 0;
    }
    footer {
      text-align: center;
      margin-top: 56px;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
